<!DOCTYPE html>
<html>
<head>
    <title>Who's That On The Screen?</title>
    <meta http-equiv="Permissions-Policy" content="camera=self">
    <script src="https://sociallearninglab.github.io/baby_view_baby/jspsych/jspsych.js"></script>
    <link href="https://sociallearninglab.github.io/baby_view_baby/jspsych/jspsych.css" rel="stylesheet" type="text/css">
    <script src="https://sociallearninglab.github.io/baby_view_baby/jspsych/plugin-html-button-response.js"></script>
    <script src="https://sociallearninglab.github.io/baby_view_baby/jspsych/plugin-html-keyboard-response.js"></script>
    <script src="https://unpkg.com/@jspsych/plugin-video-keyboard-response"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: white !important;
        }
        #jspsych-target {
            width: 100%;
            height: 100%;
            background-color: white !important;
        }
        #jspsych-video-keyboard-response-stimulus {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            background-color: black;
        }
        .calibration-point {
            position: absolute;
            width: 50px;
            height: 50px;
            background: red;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 1s infinite;
            z-index: 100;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.5); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        #webcam-container {
            width: 100vw;
            height: 100vh;
            background-color: white !important;
            margin: 0;
            padding: 0;
            position: fixed;
            top: 0;
            left: 0;
            overflow: hidden;
        }
        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }
        #timer {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 18px;
            display: none;
            z-index: 100;
        }
        .instruction-text {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 18px;
            z-index: 101;
        }
        #exit-confirmation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
            z-index: 1000;
            display: none;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        #exit-confirmation h3 {
            margin-top: 0;
        }
        #exit-confirmation .button-container {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        #exit-confirmation button {
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            font-size: 16px;
        }
        #exit-yes {
            background-color: #f44336;
            color: white;
        }
        #exit-no {
            background-color: #4CAF50;
            color: white;
        }
        .fade-out {
            animation: fadeOut 2s forwards;
        }
        @keyframes fadeOut {
            from { opacity: 1; background-color: white; }
            to { opacity: 1; background-color: black; }
        }
    </style>
</head>
<body>
    <div id="jspsych-target"></div>
    <div id="timer">00:00</div>
    <div id="exit-confirmation">
        <h3>Are you sure you want to exit?</h3>
        <div class="button-container">
            <button id="exit-yes">Yes</button>
            <button id="exit-no">No</button>
        </div>
    </div>
    <audio id="chime" preload="auto" src="https://github.com/sociallearninglab/baby_view_other_baby/raw/refs/heads/main/mp3/chime.mp3"></audio>
    <audio id="song" preload="auto" src="https://github.com/sociallearninglab/baby_view_other_baby/raw/refs/heads/main/mp3/song.mp3" loop></audio>
    <audio id="alldone" preload="auto" src="https://github.com/sociallearninglab/baby_view_other_baby/raw/refs/heads/main/mp3/alldone.mp3"></audio>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const jsPsych = initJsPsych({
                display_element: 'jspsych-target',
                on_finish: function() {
                    console.log("Mirror experiment completed");
                }
            });

            function enterFullscreen() {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.warn("Couldn't enter fullscreen:", err);
                    });
                } else if (document.documentElement.mozRequestFullScreen) {
                    document.documentElement.mozRequestFullScreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    document.documentElement.msRequestFullscreen();
                }
            }
            
            function requestCameraAccess() {
                return navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 1920 },
                        height: { ideal: 1080 },
                        facingMode: 'user'
                    }
                })
                .then(function(stream) {
                    window.webcamStream = stream;
                    return true;
                })
                .catch(function(err) {
                    console.error("Webcam error:", err);
                    if (err.name === 'NotAllowedError') {
                        alert('Camera access was blocked. Please check your browser settings and allow camera access for this site.');
                    } else {
                        alert('Error accessing webcam: ' + err.message);
                    }
                    return false;
                });
            }

            const fullScreenInstructionTrial = {
                type: jsPsychHtmlButtonResponse,
                stimulus: `
                    <div style="padding: 20px;">
                        <img src="jspsych/final_jspsych_instructions.png" width=65% height=65%><img>
                    </div>
                `,
                choices: ['Continue'],
                on_load: function() {
                    setTimeout(function() {
                        requestCameraAccess().then(function(success) {
                            console.log("Camera permission obtained:", success);
                        });
                    }, 5000);
                },
                on_finish: function() {
                    enterFullscreen();
                }
            };

            const calibrationTrial = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: `
                    <div style="width: 100vw; height: 100vh; position: relative; background-color: white;">
                        <div id="calibration-point" class="calibration-point" style="left: 50%; top: 50%;"></div>
                    </div>
                `,
                choices: "NO_KEYS",
                trial_duration: 10000,
                on_load: function() {
                    const point = document.getElementById('calibration-point');
                    const chime = document.getElementById('chime');
                    const positions = [
                        { left: '50%', top: '50%' },
                        { left: '20%', top: '50%' },
                        { left: '80%', top: '50%' },
                        { left: '50%', top: '20%' },
                        { left: '50%', top: '80%' }
                    ];
                    let currentPos = 0;
                    function moveDot() {
                        if (currentPos < positions.length) {
                            point.style.left = positions[currentPos].left;
                            point.style.top = positions[currentPos].top;
                            chime.currentTime = 0;
                            chime.play().catch(e => console.log("Audio error:", e));
                            currentPos++;
                            setTimeout(moveDot, 2000);
                        }
                    }
                    moveDot();
                }
            };

            const mirrorTrial = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: `
                    <div id="webcam-container">
                        <video id="webcam" autoplay playsinline></video>
                    </div>
                `,
                choices: [],
                trial_duration: 180000,
                on_load: function(data) {
                    const escapeHandler = function(e) {
                        if (e.key === 'e' || e.key === 'E') {
                            e.preventDefault();
                            document.getElementById('exit-confirmation').style.display = 'block';
                        }
                    };
                    document.addEventListener('keydown', escapeHandler);
                    window.mirrorEscapeHandler = escapeHandler;
                    
                    const timerEl = document.getElementById('timer');
                    timerEl.style.display = 'block';

                    const song = document.getElementById('song');
                    song.currentTime = 0;
                    song.loop = true;
                    song.play().catch(e => console.log("Audio error:", e));

                    let trialEnded = false;
                    
                    const exitConfirmation = document.getElementById('exit-confirmation');
                    const exitYes = document.getElementById('exit-yes');
                    const exitNo = document.getElementById('exit-no');
                    
                    exitYes.addEventListener('click', function() {
                        exitConfirmation.style.display = 'none';
                        if (!trialEnded) {
                            trialEnded = true;
                            if (window.webcamStream) {
                                window.webcamStream.getTracks().forEach(track => track.stop());
                            }
                            song.pause();
                            timerEl.style.display = 'none';
                            try {
                                window.close();
                            } catch (e) {
                                console.log("Couldn't close window:", e);
                                jsPsych.finishTrial();
                            }
                        }
                    });
                    
                    exitNo.addEventListener('click', function() {
                        exitConfirmation.style.display = 'none';
                    });

                    if (window.webcamStream && window.webcamStream.active) {
                        const video = document.getElementById('webcam');
                        video.srcObject = window.webcamStream;
                        startTimer();
                    } else {
                        navigator.mediaDevices.getUserMedia({ 
                            video: { 
                                width: { ideal: 1920 },
                                height: { ideal: 1080 },
                                facingMode: 'user'
                            }
                        })
                        .then(function(stream) {
                            const video = document.getElementById('webcam');
                            video.srcObject = stream;
                            window.webcamStream = stream;
                            startTimer();
                        })
                        .catch(function(err) {
                            console.error("Webcam error:", err);
                            if (err.name === 'NotAllowedError') {
                                alert('Camera access was blocked. Please check your browser settings and allow camera access for this site.');
                            } else {
                                alert('Error accessing webcam: ' + err.message);
                            }
                            if (!trialEnded) {
                                trialEnded = true;
                                jsPsych.finishTrial();
                            }
                        });
                    }

                    function startTimer() {
                        let timeLeft = 180;
                        const updateTimer = () => {
                            const minutes = Math.floor(timeLeft / 60);
                            const seconds = timeLeft % 60;
                            timerEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                            if (timeLeft > 0) {
                                timeLeft--;
                                setTimeout(updateTimer, 1000);
                            } else if (!trialEnded) {
                                trialEnded = true;
                                if (window.webcamStream) {
                                    window.webcamStream.getTracks().forEach(track => track.stop());
                                }
                                timerEl.style.display = 'none';
                                jsPsych.finishTrial();
                            }
                        };
                        updateTimer();
                    }
                },
                on_finish: function() {
                    if (window.mirrorEscapeHandler) {
                        document.removeEventListener('keydown', window.mirrorEscapeHandler);
                    }
                    document.getElementById('timer').style.display = 'none';
                    if (window.webcamStream) {
                        window.webcamStream.getTracks().forEach(track => track.stop());
                    }
                }
            };
            
            const fadeToBlackTrial = {
                type: jsPsychHtmlKeyboardResponse,
                stimulus: '<div style="width:100vw; height:100vh; background-color: white;" class="fade-out"></div>',
                choices: "NO_KEYS",
                trial_duration: 2000
            };

            const videoTrial = {
                type: jsPsychVideoKeyboardResponse,
                stimulus: [
                    'https://web.stanford.edu/group/gweonlab/baby_view_baby_other_video.mp4'
                ],
                autoplay: true,
                trial_ends_after_video: true,
                on_load: function() {
                    document.querySelector('video').muted = true;
                    const song = document.getElementById('song');
                    if (song.paused) {
                        song.play().catch(e => console.log("Audio error:", e));
                    }

                    const timerEl = document.getElementById('timer');
                    const video = document.querySelector('video');
                    
                    function startTimer(duration) {
                        let timeLeft = Math.round(duration);

                        const updateTimer = () => {
                            if (timeLeft >= 0 && timerEl.style.display === 'block') {
                                const minutes = Math.floor(timeLeft / 60);
                                const seconds = timeLeft % 60;
                                timerEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                                timeLeft--;
                                setTimeout(updateTimer, 1000);
                            }
                        };
                        
                        timerEl.style.display = 'block';
                        updateTimer();
                    }
                    
                    video.addEventListener('loadedmetadata', function() {
                        startTimer(video.duration);
                    });
                },
                on_finish: function() {
                    document.getElementById('timer').style.display = 'none';
                    const song = document.getElementById('song');
                    song.pause();
                    const alldone = document.getElementById('alldone');
                    alldone.play().catch(e => console.log("Audio error:", e));
                }
            };

            

            const complete = {
                type: jsPsychHtmlButtonResponse,
                stimulus: `
                    <div style="text-align: center; padding: 20px; background-color: white; color: black;">
                        <h2 style="color: black; font-size: 36px;">All done!</h2>
                        <p style="color: black; font-size: 24px;">Please close this tab and return to Lookit where you may continue.</p>
                    </div>
                `,
                choices: ['Close Window'],
                button_html: '<button class="jspsych-btn" style="font-size: 24px; padding: 15px 30px; background-color: #4CAF50; color: white;">%choice%</button>',
                on_finish: function() {
                    const song = document.getElementById('song');
                    song.pause();
                    window.close();
                }
            };

            const timeline = [
                fullScreenInstructionTrial,
                calibrationTrial,
                videoTrial,
                fadeToBlackTrial,
                mirrorTrial,
                complete
            ];

            const urlParams = new URLSearchParams(window.location.search);
            const returnToLookit = urlParams.get('returnToLookit') === 'true';

            jsPsych.finishCallback = function() {
                if (returnToLookit) {
                    window.location.href = window.parent.location.href;
                }
            };

            jsPsych.run(timeline);
        });
    </script>
</body>
</html>
